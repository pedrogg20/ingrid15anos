<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite 15 Anos de Ingrid</title>
    <link rel="icon" type="image/jpeg" href="last_frame.jpg">
    <meta property="og:title" content="Convite 15 Anos de Ingrid">
    <meta property="og:description" content="Você está convidado para o meu aniversário de 15 anos!">
    <meta property="og:image" content="https://pedrogg20.github.io/ingrid15anos/last_frame.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Convite 15 Anos de Ingrid">
    <meta name="twitter:description" content="Você está convidado para o meu aniversário de 15 anos!">
    <meta name="twitter:image" content="https://pedrogg20.github.io/ingrid15anos/last_frame.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container img,
        .container video {
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }

        .link-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 60px;
            cursor: pointer;
            z-index: 10;
        }

        .link-localizacao {
            position: absolute;
            top: 75%;
            left: 10%;
            width: 18%;
            padding-top: 18%;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        .link-whatsapp {
            position: absolute;
            top: 75%;
            left: 39%;
            width: 19%;
            padding-top: 19%;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .link-presentes {
            position: absolute;
            top: 75%;
            left: 70%;
            width: 19%;
            padding-top: 19%;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }
    </style>

</head>

<body>
    <div id="app" class="container">
    </div>

    <script>
        const app = document.getElementById('app');

        function renderTela1() {
            app.innerHTML = `
                <img src="01.png" alt="Página Inicial">
                <a href="#" class="link-overlay" title="Avançar" onclick="renderTela2(); return false;"></a>
            `;
            document.title = "Início";
        }

        function renderTela2() {
            app.innerHTML = `
                <video id="video" autoplay playsinline poster="poster.jpg">
                    <source src="01.mp4" type="video/mp4">
                </video>
            `;
            document.title = "Vídeo";

            const video = document.getElementById('video');
            let transitioned = false;
            let linksShown = false;

            video.addEventListener('timeupdate', function () {
                if (!linksShown && video.duration && video.currentTime >= 9) {
                    linksShown = true;
                    renderTela3();
                } else if (!transitioned && video.duration && video.currentTime >= video.duration - 0.1) {
                    transitioned = true;
                    video.pause();
                }
            });
        }

        function renderTela3() {
            const video = document.getElementById('video');
            const links = `
                <a href="https://www.google.com/maps/place/R.+We+Sete,+40+-+Guanabara,+Ananindeua+-+PA,+67110-120/@-1.3937545,-48.414925,571m/data=!3m1!1e3!4m6!3m5!1s0x92a48adc8ffe5235:0x58e4ff338c2144e8!8m2!3d-1.3936256!4d-48.4143752!16s%2Fg%2F11c117ggdr?authuser=0&entry=ttu&g_ep=EgoyMDI2MDMyNC4wIKXMDSoASAFQAw%3D%3D"
                    target="_blank" class="link-localizacao" title="Localização"></a>
                <a href="https://wa.link/c5zmc7" target="_blank" class="link-whatsapp" title="WhatsApp"></a>
                <a href="presentes.html" class="link-presentes" title="Presentes"></a>
            `;
            video.insertAdjacentHTML('afterend', links);
            document.title = "Contato";
        }

        renderTela1();
    </script>
</body>

</html>
